services:
  # FastAPI Backend Service
  - type: web
    name: airbnb-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000

  # Next.js Frontend Service
  - type: web
    name: airbnb-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start -- -p $PORT"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: airbnb-backend
          property: host