# Render blueprint for https://airbnb-clone-api-t8pv.onrender.com
# Frontend: https://airbnb-clone-frontend-gamma.vercel.app (needs NEXT_PUBLIC_API_URL=https://airbnb-clone-api-t8pv.onrender.com/api)
services:
  - type: web
    name: airbnb-clone-api-t8pv
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: airbnb-clone-api-t8pv.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://airbnb-clone-frontend-gamma.vercel.app
